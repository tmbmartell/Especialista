name: Verificação do MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: |
          python -m pip install -r apps/api/requirements.txt
          python -m pip install pytest httpx
      - name: Testar API, preços, isolamento e autenticação
        env:
          PYTHONPATH: apps/api
        run: pytest -q apps/api/tests/
      - name: Verificar JavaScript
        run: |
          node --check apps/web/app.js
          node --check apps/web/account.js
          node --check apps/web/experience.js
      - name: Checar JSON do catálogo
        run: python -m json.tool apps/web/catalogo.json > /dev/null
          python -m json.tool apps/web/experiencias.json > /dev/null
